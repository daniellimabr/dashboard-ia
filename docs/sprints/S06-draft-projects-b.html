  function backlogB() {
    const cols = ["planejado", "andamento", "bloqueado", "pronto"];
    const ideas = backlog.filter((b) => b.st === "ideia");
    return `<div class="kan">${cols
      .map((c) => {
        const it = backlog.filter((b) => b.st === c);
        return `<section class="kcol c-${c}"><header><span class="pill s-${c}">${ST[c]}</span><span class="mono muted num">${it.length}</span></header>
    ${
      it
        .map(
          (
            b,
          ) => `<article class="kcard"><span>${esc(b.item)}</span><div class="meta"><span>${b.id}</span><span class="chip">${b.sprint}</span>${b.done ? `<span style="color:var(--ok)">✓ ${br(b.done)}</span>` : ""}${b.note ? `<span>${esc(b.note)}</span>` : ""}</div>
      <div class="ctl">${ctlSt(b)}${ctlSp(b)}${c === "pronto" ? ctlDt(b) : ""}</div></article>`,
        )
        .join("") || `<span class="muted" style="font-size:12px">vazio</span>`
    }</section>`;
      })
      .join("")}</div>
  <div class="card" style="margin-top:12px"><h3>Ideias sem sprint (${ideas.length})</h3>${ideas.map((b) => `<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line);font-size:13px"><span><span class="mono muted">${b.id}</span> ${esc(b.item)}</span>${ctlSp(b)}</div>`).join("")}</div>`;
  }
  const backlogSrc = () =>
    footer(
      [
        ["Itens", "<span class=mono>docs/backlog.md</span> (hoje: lista solta, vira tabela)"],
        ["Status, sprint, pronto em", "colunas da tabela no mesmo arquivo"],
        [
          "Pronto em (automático)",
          "data do <span class=mono>hx sprint close</span> da sprint do item, se a coluna estiver vazia",
        ],
      ],
      `<span>O backlog hoje é texto livre: não dá para ler status nem sprint. Proposta de formato (uma tabela, uma linha por item; status em minúsculas):</span>
<pre>| ID  | Item                               | Status       | Sprint | Pronto em  |
|-----|------------------------------------|--------------|--------|------------|
| B04 | Backlog com status e sprint        | em andamento | S06    |            |
| B03 | Página de Projetos                 | pronto       | S05    | 2026-10-20 |
| B09 | Tema claro                         | ideia        |        |            |</pre>
<span>Status válidos: ideia · planejado · em andamento · bloqueado · pronto. Editar pelo painel exige o servidor gravar no .md (hoje ele só lê) — decidir se vale ou se o painel fica só leitura.</span>`,
    );

  /* ---------- Roadmap ---------- */
  let stage = roadmap.find((s) => s.cur).n;
  const stState = (s) => (s.cur ? "cur" : s.n < roadmap.find((r) => r.cur).n ? "done" : "");
  const pctDone = (s) =>
    Math.round((s.items.filter((i) => i[1] === "pronto").length / s.items.length) * 100);
  function roadmapA() {
    const s = roadmap.find((r) => r.n === stage);
    return `<div class="rail" role="group" aria-label="Etapas">${roadmap
      .map(
        (
          r,
        ) => `<button class="stp ${stState(r)}" data-stage="${r.n}" aria-pressed="${r.n === stage}">
    <span class="lbl">Etapa ${r.n}${r.cur ? " · atual" : stState(r) === "done" ? " · feita" : ""}</span><b>${esc(r.name)}</b><span class="mono" style="font-size:11px">${r.when} · ${pctDone(r)}%</span></button>`,
      )
      .join("")}</div>
  <div class="card scroll" style="padding:0"><table><thead><tr><th>Etapa ${s.n} · ${esc(s.name)}</th><th>Status</th><th>Sprint</th></tr></thead><tbody>
  ${s.items.map((i) => `<tr class="${i[1] === "pronto" ? "done" : ""}"><td>${esc(i[0])}</td><td>${pill(i[1])}</td><td><span class="chip">${i[2]}</span></td></tr>`).join("")}</tbody></table></div>
  <p class="muted" style="font-size:12px">Clique numa etapa para ver os itens dela. A etapa atual vem aberta.</p>`;
  }
  function roadmapB() {
    return `<div class="vt">${roadmap
      .map(
        (r) => `<div class="vs ${stState(r)}"><div class="card">
    <header><div><span class="lbl" style="${r.cur ? "color:var(--accent)" : ""}">Etapa ${r.n}${r.cur ? " · você está aqui" : ""}</span><h2 style="font-size:${r.cur ? 20 : 16}px">${esc(r.name)}</h2></div><span class="mono muted" style="font-size:12px">${r.when} · <span class="num">${pctDone(r)}%</span></span></header>
    <div class="bar"><i style="width:${pctDone(r)}%;background:${r.cur ? "var(--accent)" : "var(--ok)"}"></i></div>
    ${r.cur || !stState(r) ? `<ul>${r.items.map((i) => `<li><span>${esc(i[0])}</span>${pill(i[1])}<span class="chip">${i[2]}</span></li>`).join("")}</ul>` : `<span class="muted" style="font-size:12px">${r.items.length} itens, todos prontos</span>`}
  </div></div>`,
      )
      .join("")}</div>`;
  }
  const roadmapSrc = () =>
    footer(
      [
        [
          "Etapas e itens",
          "<span class=mono>docs/roadmap.md</span> (campo <span class=mono>roadmap</span> do projeto)",
        ],
        [
          "Etapa atual",
          "marcador <span class=mono>(atual)</span> no título da etapa; sem marcador = primeira etapa com item não pronto",
        ],
        ["% da etapa", "itens com status pronto ÷ total"],
        [
          "Status do item",
          "coluna da tabela; se o item tiver ID do backlog (B04), o status vem do backlog",
        ],
      ],
      `<span>Hoje o roadmap é markdown livre, sem status nem sprint por item. Proposta: um título por etapa e uma tabela embaixo.</span>
<pre>## Etapa 3 — Gestão de projeto (atual)
Quando: S06–S07

| Item                            | Status       | Sprint | Backlog |
|---------------------------------|--------------|--------|---------|
| Backlog com controle por item   | em andamento | S06    | B04     |
| Consumo por dia, sprint e agente| planejado    | S07    | B06     |</pre>
<span>A coluna Backlog liga os dois arquivos e evita status duplicado. Mesmo status válidos do backlog.</span>`,
    );

  /* ---------- Consumo ---------- */
  let unit = "usd";
  const COL = AG.map((a) => `var(${a[1]})`);
  function dayChart(stacked) {
    const W = 700,
      H = 200,
      pad = 28,
      bw = (W - pad) / DAYS.length;
    const vals = unit === "usd" ? byDay.map(sum) : tokDay,
      max = Math.max(...vals) * 1.15;
    const y = (v) => H - 18 - (v / max) * (H - 30);
    const grid = [0, 0.5, 1]
      .map((f) => {
        const v = (max / 1.15) * f;
        return `<line x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="0" y="${y(v) + 3}">${unit === "usd" ? v.toFixed(0) : v.toFixed(1)}</text>`;
      })
      .join("");
    const bars = DAYS.map((d, i) => {
      const x = pad + i * bw + bw * 0.18,
        w = bw * 0.64;
      let base = H - 18,
        segs = "";
      if (stacked && unit === "usd")
        byDay[i].forEach((v, k) => {
          const h = (v / max) * (H - 30);
          base -= h;
          segs += `<rect x="${x}" y="${base}" width="${w}" height="${h}" fill="${COL[k]}"><title>${d} · ${AG[k][0]} · ${usd(v)}</title></rect>`;
        });
      else {
        const v = vals[i];
        segs = `<rect x="${x}" y="${y(v)}" width="${w}" height="${H - 18 - y(v)}" fill="var(--accent)" opacity="${i === DAYS.length - 1 ? 1 : 0.7}"><title>${d} · ${unit === "usd" ? usd(v) : tok(v)}</title></rect>`;
      }
      return (
        segs +
        (i % 2 === 1 || i === DAYS.length - 1
          ? `<text x="${x + w / 2}" y="${H - 4}" text-anchor="middle">${d.slice(0, 2)}</text>`
          : "")
      );
    }).join("");
    const line = !stacked
      ? ""
      : `<polyline fill="none" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="3 3" points="${tokDay.map((t, i) => `${pad + i * bw + bw / 2},${H - 18 - (t / Math.max(...tokDay) / 1.15) * (H - 30)}`).join(" ")}"/>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Consumo por dia, últimos 14 dias">${grid}${bars}${unit === "usd" ? line : ""}</svg>`;
  }
  const agTotals = () => AG.map((_, k) => sum(byDay.map((d) => d[k])));
  function consumoA() {
    const tot = sum(byDay.map(sum)),
      totTok = sum(tokDay),
      today = sum(byDay.at(-1)),
      week = sum(byDay.slice(-7).map(sum));
    const maxS = Math.max(...bySprint.map((s) => sum(s[1])));
    const at = agTotals();
    return `<div class="kpis"><div><small>Hoje</small><b class="num">${usd(today)}</b><small>${tok(tokDay.at(-1))} tokens</small></div>
    <div><small>Últimos 7 dias</small><b class="num">${usd(week)}</b><small>${tok(sum(tokDay.slice(-7)))} tokens</small></div>
    <div><small>Sprint S06 (em curso)</small><b class="num">${usd(sum(bySprint.at(-1)[1]))}</b><small>média S01–S05: ${usd(sum(bySprint.slice(0, 5).map((s) => sum(s[1]))) / 5)}</small></div>
    <div><small>14 dias</small><b class="num">${usd(tot)}</b><small>${tok(totTok)} tokens</small></div></div>
  <div class="grid g2">
    <div class="card"><h3>Custo por dia · 14 dias</h3>${dayChart(false)}<div class="key"><span style="--c:var(--accent)">US$ por dia (hoje mais forte)</span></div></div>
    <div class="card"><h3>Por sprint</h3><div class="hb">${bySprint.map((s) => `<span class="mono" style="font-size:12px">${s[0]}</span><span class="track"><i style="width:${(sum(s[1]) / maxS) * 100}%;background:var(--accent)"></i></span><span class="v">${usd(sum(s[1]))} · ${tok(s[2])}</span>`).join("")}</div></div>
    <div class="card"><h3>Por agente · 14 dias</h3><div class="hb">${AG.map((a, k) => `<span>${a[0]}</span><span class="track"><i style="width:${(at[k] / Math.max(...at)) * 100}%;background:var(${a[1]})"></i></span><span class="v">${usd(at[k])} · ${Math.round((at[k] / tot) * 100)}%</span>`).join("")}</div></div>
  </div>`;
  }
  function consumoB() {
    const at = agTotals(),
      tot = sum(at);
    return `<div class="vars"><span class="lbl">Ver em</span><div class="seg" role="group"><button data-unit="usd" aria-pressed="${unit === "usd"}">US$</button><button data-unit="tok" aria-pressed="${unit === "tok"}">tokens</button></div></div>
  <div class="card"><h3>${unit === "usd" ? "Custo por dia, dividido por agente" : "Tokens por dia"} · 14 dias</h3>${dayChart(true)}
    <div class="key">${unit === "usd" ? AG.map((a) => `<span style="--c:var(${a[1]})">${a[0]}</span>`).join("") + `<span style="--c:transparent;border-top:1.5px dashed var(--fg)">tokens (linha)</span>` : `<span style="--c:var(--accent)">milhões de tokens</span>`}</div></div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card scroll"><h3>Por sprint e agente</h3><table><thead><tr><th>Sprint</th><th>Divisão</th><th class="r">US$</th><th class="r">Tokens</th></tr></thead><tbody>
      ${bySprint.map((s) => `<tr><td class="mono">${s[0]}</td><td style="width:40%"><div class="stack" style="margin:0;height:10px">${s[1].map((v, k) => `<i style="width:${(v / sum(s[1])) * 100}%;background:${COL[k]}" title="${AG[k][0]} ${usd(v)}"></i>`).join("")}</div></td><td class="r mono num">${usd(sum(s[1]))}</td><td class="r mono num">${tok(s[2])}</td></tr>`).join("")}</tbody></table></div>
    <div class="card"><h3>Quem gasta · 14 dias</h3><div class="stack">${at.map((v, k) => `<i style="width:${(v / tot) * 100}%;background:${COL[k]}"></i>`).join("")}</div>
      <table><tbody>${AG.map((a, k) => `<tr><td><span class="chip" style="color:var(${a[1]})">●</span> ${a[0]}</td><td class="r mono num">${usd(at[k])}</td><td class="r mono muted num">${Math.round((at[k] / tot) * 100)}%</td></tr>`).join("")}</tbody></table>
      <p class="muted" style="font-size:12px;margin:8px 0 0">Clones gastam mais nos dias de onda paralela (17/10, 20/10).</p></div>
  </div>`;
  }
  const consumoSrc = () =>
    footer(
      [
        [
          "Custo e tokens por dia",
          "hoje: <span class=mono>usage</span> (UsageDay: projeto, dia, tokens, US$). Futuro: transcripts do Claude Code (<span class=mono>~/.claude/projects/*/*.jsonl</span>, campo <span class=mono>message.usage</span> de cada resposta)",
        ],
        ["US$", "tokens × tabela de preço por modelo (entrada, saída, cache)"],
        [
          "Por sprint",
          'janela entre <span class=mono>hx sprint open</span> e <span class=mono>close</span> nos eventos do harness; o que cai fora vai para "fora da sprint"',
        ],
        [
          "Por agente",
          "transcript do subagente (sidechain / tipo do agente: tech-lead, clone, reviewer)",
        ],
      ],
      `<span>UsageDay não tem agente nem sprint: os gráficos B e o bloco "por agente" da A não saem dos dados atuais. Opções: (1) o importador lê os transcripts e soma por agente e por janela de sprint; (2) pedir ao harness um evento <span class=mono>usage</span> com <span class=mono>agent</span> e <span class=mono>sprint</span> (<span class=mono>hx request</span>). Recomendo (2): menos parsing frágil no painel.</span>
<pre>{"type":"usage","at":"2026-10-21T14:50:00Z","project":"dashboard-ia","sprint":"S06","task":"T04","agent":"clone","model":"opus","in":12000,"out":3400,"cacheRead":80000,"usd":0.42}</pre>`,
    );

  /* ---------- telas e variantes ---------- */
  const SCREENS = [
    {
      id: "backlog",
      name: "Backlog",
      v: [
        [
          "A · Tabela",
          "Uma linha por item, com status, sprint planejada e data de pronto editáveis. Filtro por status.",
          backlogA,
        ],
        [
          "B · Quadro",
          "Colunas por status; cada cartão mostra sprint e data e tem os controles. Ideias sem sprint ficam abaixo.",
          backlogB,
        ],
      ],
      src: backlogSrc,
    },
    {
      id: "roadmap",
      name: "Roadmap",
      v: [
        [
          "A · Trilho",
          "Etapas lado a lado; a atual em azul. Clicar numa etapa mostra seus itens com status e sprint.",
          roadmapA,
        ],
        [
          "B · Linha vertical",
          'Etapas de cima para baixo com barra de %; a atual é maior e marcada "você está aqui".',
          roadmapB,
        ],
      ],
      src: roadmapSrc,
    },
    {
      id: "consumo",
      name: "Consumo",
      v: [
        [
          "A · Números + barras",
          "4 números no topo, custo por dia, por sprint e por agente em barras simples.",
          consumoA,
        ],
        [
          "B · Por agente",
          "Colunas diárias empilhadas por agente com linha de tokens; tabela por sprint com divisão por agente; troca US$/tokens.",
          consumoB,
        ],
      ],
      src: consumoSrc,
    },
  ];
  let cur = location.hash.slice(1),
    variant = 0;
  if (!SCREENS.some((s) => s.id === cur)) cur = "backlog";
  function draw() {
    const s = SCREENS.find((x) => x.id === cur),
      [label, desc, render] = s.v[variant];
    document.getElementById("tabs").innerHTML = SCREENS.map(
      (x) =>
        `<button role="tab" aria-selected="${x.id === cur}" data-s="${x.id}">${x.name}</button>`,
    ).join("");
    document.getElementById("app").innerHTML =
      `<p class="draftnote">Rascunho S06 · dados de exemplo.</p>
    <div class="vars"><div class="seg" role="group" aria-label="Variante">${s.v.map((v, i) => `<button data-var="${i}" aria-pressed="${i === variant}">${v[0]}</button>`).join("")}</div><span class="muted">${desc}</span></div>
    ${render()}${s.src()}`;
  }
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    const d = t.dataset;
    if (d.s) {
      cur = d.s;
      variant = 0;
      history.replaceState(null, "", "#" + cur);
    } else if (d.var) variant = +d.var;
    else if (d.f) filter = d.f;
    else if (d.stage) stage = +d.stage;
    else if (d.unit) unit = d.unit;
    else return;
    draw();
  });
  // controles do backlog mudam o dado de exemplo (no real, reescreveriam a linha no .md)
  document.addEventListener("change", (e) => {
    const el = e.target,
      b = backlog.find((x) => x.id === el.dataset.id);
    if (!b) return;
    b[el.dataset.k] = el.value;
    if (el.dataset.k === "st" && el.value === "pronto" && !b.done) b.done = "2026-10-21";
    draw();
  });
  draw();
</script>
