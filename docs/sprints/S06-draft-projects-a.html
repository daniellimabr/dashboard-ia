<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Projetos — rascunho A</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap"
    />
    <style>
      /* Tokens copiados de src/styles.css; estrutura (barra, abas, chips, acordeão) segue docs/sprints/S02-draft.html */
      :root {
        --bg: #0d1117;
        --fg: #dfe6ee;
        --muted: #7d8a99;
        --line: #222b36;
        --card: #121922;
        --accent: #4cc2ff;
        --r: 2px;
        --run: #4cc2ff;
        --warn: #f0b429;
        --bad: #ff5d5d;
        --ok: #3ddc97;
        --tl: #4cc2ff;
        --cl: #f39a55;
        --rv: #a98bff;
        --f-ui: "IBM Plex Sans Condensed", system-ui, sans-serif;
        --f-mono: "IBM Plex Mono", ui-monospace, monospace;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--f-ui);
        margin: 0;
      }
      button,
      a {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .mono,
      .lbl,
      h3 {
        font-family: var(--f-mono);
      }
      .muted {
        color: var(--muted);
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .wrap {
        padding-inline: 16px;
      }
      .nav {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding-block: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 20px;
        align-items: center;
      }
      .brand {
        font: 600 13px var(--f-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .crumb {
        font-size: 14px;
        color: var(--muted);
      }
      .crumb b {
        color: var(--fg);
        font-weight: 600;
      }
      .tabs {
        display: flex;
        gap: 2px;
        flex-wrap: wrap;
      }
      .tabs button {
        border: 1px solid transparent;
        background: transparent;
        padding: 6px 12px;
        font-size: 14px;
        color: var(--muted);
        border-radius: var(--r);
      }
      .tabs button[aria-selected="true"] {
        color: var(--fg);
        border-color: var(--line);
        background: var(--card);
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      main {
        padding-block: 20px 40px;
        max-width: 1000px;
      }
      .draftnote {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 16px;
      }
      h3 {
        margin: 18px 0 8px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 500;
      }
      .vars {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        margin-bottom: 14px;
        font-size: 13px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 6px 12px;
        font-size: 13px;
      }
      .seg button[aria-pressed="true"] {
        background: var(--fg);
        color: var(--bg);
      }
      .chip {
        font: 500 10px var(--f-mono);
        padding: 2px 6px;
        border-radius: 3px;
        background: var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .chip.ok {
        background: color-mix(in srgb, var(--ok) 16%, transparent);
        color: var(--ok);
      }
      .chip.run {
        background: color-mix(in srgb, var(--run) 16%, transparent);
        color: var(--run);
      }
      .chip.warn {
        background: color-mix(in srgb, var(--warn) 16%, transparent);
        color: var(--warn);
      }
      .chip.bad {
        background: color-mix(in srgb, var(--bad) 16%, transparent);
        color: var(--bad);
      }
      .box {
        border: 1px solid var(--line);
        background: var(--card);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        font: 500 10px var(--f-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        text-align: left;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.t {
        font-weight: 600;
        font-size: 14px;
      }
      td small {
        display: block;
        color: var(--muted);
        font-weight: 400;
        font-size: 12px;
      }
      .scroll {
        overflow-x: auto;
      }
      /* acordeão com <details> nativo */
      details {
        border: 1px solid var(--line);
        background: var(--card);
      }
      details + details {
        margin-top: 6px;
      }
      summary {
        list-style: none;
        cursor: pointer;
        padding: 10px 12px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px 12px;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary:hover {
        background: color-mix(in srgb, var(--fg) 4%, transparent);
      }
      .st {
        font-weight: 600;
        font-size: 14px;
        min-width: 0;
      }
      .st::before {
        content: "▸ ";
        color: var(--muted);
      }
      details[open] .st::before {
        content: "▾ ";
        color: var(--accent);
      }
      .st small {
        display: block;
        font-weight: 400;
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
        line-height: 1.35;
      }
      .sr {
        font: 12px var(--f-mono);
        color: var(--muted);
        text-align: right;
        white-space: nowrap;
      }
      .sc {
        grid-column: 1/-1;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        align-items: center;
        font: 11px var(--f-mono);
        color: var(--muted);
      }
      .pbar {
        grid-column: 1/-1;
        height: 5px;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
      }
      .pbar i {
        display: block;
        height: 100%;
        background: var(--ok);
      }
      .body {
        border-top: 1px solid var(--line);
        padding: 10px 12px;
        display: grid;
        gap: 10px;
        font-size: 13px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .links a,
      .links span {
        border: 1px solid var(--line);
        padding: 5px 10px;
        border-radius: var(--r);
        font-size: 13px;
      }
      .links span {
        color: var(--muted);
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        margin: 0;
      }
      .kv dt {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
        font-family: var(--f-mono);
        font-size: 12px;
      }
      .srow {
        display: grid;
        grid-template-columns: 52px 1fr auto auto;
        gap: 12px;
        align-items: center;
      }
      .cards {
        display: grid;
        gap: 6px;
      }
      .card {
        border: 1px solid var(--line);
        background: var(--card);
        padding: 10px 12px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 4px 12px;
      }
      .card b {
        font-size: 14px;
      }
      .card .m {
        font: 11px var(--f-mono);
        color: var(--muted);
      }
      .card.live {
        box-shadow: inset 3px 0 0 var(--run);
      }
      .cols2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        gap: 12px;
      }
      .docs {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .docs li {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: baseline;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .docs li:last-child {
        border-bottom: 0;
      }
      .docs .k {
        font: 500 10px var(--f-mono);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        min-width: 64px;
      }
      .foot {
        margin-top: 28px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
        font-size: 12px;
        color: var(--muted);
        display: grid;
        gap: 4px;
        max-width: 85ch;
      }
      .foot b {
        color: var(--fg);
        font-weight: 500;
      }
      .foot ul {
        margin: 0;
        padding-left: 18px;
        display: grid;
        gap: 3px;
      }
      @media (max-width: 560px) {
        .srow {
          grid-template-columns: 44px 1fr;
        }
        .srow > :nth-child(n + 3) {
          grid-column: 2;
        }
      }
    </style>
  </head>
  <body>
    <nav class="nav wrap">
      <span class="brand">Painel IA</span>
      <span class="crumb">Projetos › <b>Dashboard IA</b></span>
      <div class="tabs" role="tablist" id="tabs"></div>
    </nav>
    <main class="wrap" id="app"></main>

    <script>
      // Dados de exemplo no formato de src/data/mock.ts (Chat, Sprint, Doc). "Hoje" = 21/10/2026 14:50.
      const chats = [
        {
          id: "c1",
          title: "Executar sprint S06",
          startedAt: "21/10 13:40",
          lastAt: "21/10 14:48",
          sprintId: "S06",
          agents: 4,
          live: true,
        },
        {
          id: "c2",
          title: "Investigar limite da assinatura",
          startedAt: "21/10 09:12",
          lastAt: "21/10 11:30",
          agents: 1,
        },
        {
          id: "c3",
          title: "Planejar S06: página Projetos",
          startedAt: "20/10 16:05",
          lastAt: "20/10 18:22",
          agents: 2,
        },
        {
          id: "c4",
          title: "Fechar S05 e Release Report",
          startedAt: "19/10 10:00",
          lastAt: "20/10 09:41",
          sprintId: "S05",
          agents: 3,
        },
        {
          id: "c5",
          title: "hook lento",
          startedAt: "18/10 11:20",
          lastAt: "18/10 11:32",
          agents: 1,
        },
        {
          id: "c6",
          title: "Executar sprint S04",
          startedAt: "16/10 14:00",
          lastAt: "17/10 17:16",
          sprintId: "S04",
          agents: 5,
        },
      ];
      const sprints = [
        {
          id: "S06",
          title: "Página Projetos: chats, sprints e documentos",
          goal: "Desenhar as 3 abas da página Projetos com dados de exemplo.",
          status: "running",
          approvedAt: "21/10 13:30",
          openedAt: "21/10 13:40",
          closedAt: null,
          done: 2,
          total: 5,
          report: false,
        },
        {
          id: "S05",
          title: "Página Projetos e links",
          goal: "Criar a página Projetos e ligar projeto/sprint nas telas Controle e Linha do tempo.",
          status: "closed",
          approvedAt: "19/10 09:50",
          openedAt: "19/10 10:00",
          closedAt: "20/10 09:41",
          done: 2,
          total: 2,
          report: true,
        },
        {
          id: "S04",
          title: "Chats e linha do tempo",
          goal: "Mostrar chats e agentes de cada projeto na linha do tempo.",
          status: "closed",
          approvedAt: "16/10 13:50",
          openedAt: "16/10 14:00",
          closedAt: "17/10 17:16",
          done: 5,
          total: 5,
          report: true,
        },
        {
          id: "S03",
          title: "Servidor local e dados reais",
          goal: "Ler eventos do harness e mostrar dados reais a cada 5 s.",
          status: "closed",
          approvedAt: "15/10 09:00",
          openedAt: "15/10 09:10",
          closedAt: "15/10 18:40",
          done: 6,
          total: 6,
          report: true,
        },
        {
          id: "S02",
          title: "Layout da tela principal",
          goal: "Fechar o design do front em 3 telas com dados de exemplo.",
          status: "closed",
          approvedAt: "14/10 13:35",
          openedAt: "14/10 13:40",
          closedAt: "14/10 17:20",
          done: 7,
          total: 7,
          report: true,
        },
        {
          id: "S01",
          title: "Draft do front do painel",
          goal: "Primeiro rascunho navegável com dados de exemplo.",
          status: "closed",
          approvedAt: null,
          openedAt: "13/10 10:00",
          closedAt: "13/10 15:30",
          done: 4,
          total: 4,
          report: true,
        },
      ];
      const docs = [
        {
          kind: "ADR",
          id: "0003",
          title: "Página Projetos com abas por tipo de dado",
          status: "proposta",
          date: "21/10",
        },
        { kind: "PRD", id: "0002", title: "Página Projetos", status: "rascunho", date: "20/10" },
        {
          kind: "ADR",
          id: "0002",
          title: "Servidor local lendo eventos JSONL",
          status: "aceita",
          date: "15/10",
        },
        {
          kind: "PRD",
          id: "0001",
          title: "Painel IA: visão de todos os projetos",
          status: "aprovado",
          date: "13/10",
        },
        {
          kind: "ADR",
          id: "0001",
          title: "Arquitetura do painel",
          status: "aceita",
          date: "13/10",
        },
      ];

      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const chip = (t, k = "") => `<span class="chip ${k}">${esc(t)}</span>`;
      // "dd/mm hh:mm" -> número comparável (mesmo ano)
      const key = (s) => {
        const [d, m, h, mi] = s.match(/\d+/g).map(Number);
        return ((m * 31 + d) * 24 + h) * 60 + mi;
      };
      const byLast = [...chats].sort((a, b) => key(b.lastAt) - key(a.lastAt));
      const ST = {
        running: ["em execução", "run"],
        closed: ["fechada", "ok"],
        approved: ["aprovada", "warn"],
        planned: ["plano", "warn"],
      };
      const day = (s) => s.slice(0, 5);
      const variant = { chats: "A", sprints: "A", docs: "A" };
      let docFilter = "Todos";

      function foot(items) {
        return `<div class="foot"><b>De onde vem cada dado · o que falta</b><ul>${items.map((i) => `<li>${i}</li>`).join("")}</ul></div>`;
      }
      function varSwitch(scr, desc) {
        return `<div class="vars"><div class="seg" role="group" aria-label="Variante">${["A", "B"]
          .map(
            (v) =>
              `<button data-var="${scr}:${v}" aria-pressed="${variant[scr] === v}">Variante ${v}</button>`,
          )
          .join("")}</div><span class="muted">${desc[variant[scr]]}</span></div>`;
      }

      /* Chats */
      function chatsA() {
        return `<div class="box scroll"><table><thead><tr><th>Chat</th><th>Início</th><th>Última interação ▾</th><th>Agentes</th></tr></thead><tbody>${byLast
          .map(
            (c) =>
              `<tr><td class="t">${esc(c.title)}<small>${c.sprintId ? `sprint ${c.sprintId}` : "fora de sprint"}</small></td><td class="mono num">${c.startedAt}</td>
     <td class="mono num">${c.lastAt} ${c.live ? chip("agora", "run") : ""}</td><td class="mono num">${c.agents}</td></tr>`,
          )
          .join("")}</tbody></table></div>`;
      }
      function chatsB() {
        const groups = {};
        byLast.forEach((c) => (groups[day(c.lastAt)] ??= []).push(c));
        const label = (d) => (d === "21/10" ? "Hoje" : d === "20/10" ? "Ontem" : d);
        return Object.entries(groups)
          .map(
            ([d, list]) =>
              `<h3>${label(d)}</h3><div class="cards">${list
                .map(
                  (c) =>
                    `<div class="card ${c.live ? "live" : ""}"><b>${esc(c.title)}</b><span>${c.sprintId ? chip(c.sprintId, c.live ? "run" : "") : chip("sem sprint")}</span>
     <span class="m">início ${c.startedAt} · última ${c.lastAt.slice(6)}${day(c.startedAt) !== d ? ` (começou ${day(c.startedAt)})` : ""}</span><span class="m">${c.agents} agente${c.agents > 1 ? "s" : ""}</span></div>`,
                )
                .join("")}</div>`,
          )
          .join("");
      }
      function renderChats() {
        return (
          varSwitch("chats", {
            A: "Tabela: título, início e última interação, da mais recente para a mais antiga.",
            B: "Cartões agrupados pelo dia da última interação (mais recente primeiro); faixa azul = chat ativo.",
          }) +
          (variant.chats === "A" ? chatsA() : chatsB()) +
          foot([
            "<b>Título</b>: hoje o harness não grava um título; depende do pedido ao harness de 2026-10-21 (título do chat nos eventos). Até lá, só um id ou o primeiro prompt.",
            "<b>Início</b> e <b>última interação</b>: primeiro e último evento do chat em <span class=mono>~/.main-harness/events</span>. O tipo <span class=mono>Chat</span> do front tem <span class=mono>startedAt</span>/<span class=mono>endedAt</span>, mas falta um campo de última interação.",
            "<b>Sprint</b> e <b>agentes</b>: eventos de sprint e de agentes ligados ao chat (já existem).",
          ])
        );
      }

      /* Sprints */
      const dates = (s) =>
        `${s.openedAt ?? "—"} → ${s.closedAt ?? (s.status === "running" ? "em curso" : "—")}`;
      const links = (s) =>
        `<div class="links"><a href="#">Plano · docs/sprints/${s.id}-plan.md</a>${s.report ? `<a href="#">Release Report · docs/sprints/${s.id}-release.md</a>` : `<span>Release Report sai ao fechar a sprint</span>`}</div>`;
      function sprintsA() {
        return sprints
          .map(
            (s) => `<details ${s.status === "running" ? "open" : ""}><summary>
    <span class="st">${s.id} · ${esc(s.title)}<small>${esc(s.goal)}</small></span><span class="sr">${chip(ST[s.status][0], ST[s.status][1])}</span>
    <span class="sc"><span>${dates(s)}</span><span class="num">${s.done}/${s.total} tarefas</span></span>
    <span class="pbar"><i style="width:${Math.round((s.done / s.total) * 100)}%"></i></span></summary>
    <div class="body">${links(s)}</div></details>`,
          )
          .join("");
      }
      function sprintsB() {
        return sprints
          .map(
            (s) => `<details><summary style="grid-template-columns:1fr">
    <span class="srow"><span class="mono st" style="font-size:13px">${s.id}</span><span>${esc(s.title)}</span><span class="mono num muted" style="font-size:12px">${s.done}/${s.total}</span>${chip(ST[s.status][0], ST[s.status][1])}</span></summary>
    <div class="body"><dl class="kv"><dt>Objetivo</dt><dd style="font-family:var(--f-ui);font-size:13px">${esc(s.goal)}</dd>
      <dt>Aprovada</dt><dd>${s.approvedAt ?? "sem registro"}</dd><dt>Início → fim</dt><dd>${dates(s)}</dd><dt>Tarefas</dt><dd>${s.done} de ${s.total} feitas</dd></dl>${links(s)}</div></details>`,
          )
          .join("");
      }
      function renderSprints() {
        return (
          varSwitch("sprints", {
            A: "Fechado já mostra objetivo, status, datas e tarefas; aberto mostra os links. A sprint em curso começa aberta.",
            B: "Linha compacta (id, título, tarefas, status); aberto mostra objetivo, datas completas e os links.",
          }) +
          (variant.sprints === "A" ? sprintsA() : sprintsB()) +
          foot([
            "<b>Título</b> e <b>objetivo</b>: cabeçalho de <span class=mono>docs/sprints/SNN-plan.md</span>.",
            "<b>Status</b> e <b>datas</b> (aprovada, aberta, fechada): eventos <span class=mono>hx sprint approve|open|close</span> em <span class=mono>.harness</span>. Sprints antigas (ex.: S01) podem não ter a data de aprovação.",
            "<b>Tarefas</b> feitas/total: <span class=mono>hx task done</span> em <span class=mono>.harness</span> e a tabela do plano.",
            "<b>Links</b>: <span class=mono>SNN-plan.md</span> e <span class=mono>SNN-release.md</span>, se existirem. Falta padronizar o nome (o mock usa <span class=mono>S01-report</span>).",
          ])
        );
      }

      /* Documentos */
      const docLine = (d) =>
        `<li><span class="k">${d.kind} ${d.id}</span><a href="#">${esc(d.title)}</a><span class="mono num muted" style="font-size:11px">${chip(d.status, /aceita|aprovado/.test(d.status) ? "ok" : "warn")} ${d.date}</span></li>`;
      function docsA() {
        return `<div class="cols2">${["ADR", "PRD"]
          .map(
            (k) =>
              `<div><h3>${k === "ADR" ? "Decisões (ADR)" : "Requisitos (PRD)"}</h3><ul class="docs box">${docs
                .filter((d) => d.kind === k)
                .map(docLine)
                .join("")}</ul></div>`,
          )
          .join("")}</div>`;
      }
      function docsB() {
        const list = docs.filter((d) => docFilter === "Todos" || d.kind === docFilter);
        return `<div class="vars"><div class="seg" role="group" aria-label="Filtro">${[
          "Todos",
          "ADR",
          "PRD",
        ]
          .map(
            (f) =>
              `<button data-filter="${f}" aria-pressed="${docFilter === f}">${f} <span class="num">${f === "Todos" ? docs.length : docs.filter((d) => d.kind === f).length}</span></button>`,
          )
          .join("")}</div></div>
    <ul class="docs box">${list.map(docLine).join("")}</ul>`;
      }
      function renderDocs() {
        return (
          varSwitch("docs", {
            A: "Duas colunas: ADRs e PRDs, mais recentes primeiro.",
            B: "Lista única por data, com filtro Todos / ADR / PRD.",
          }) +
          (variant.docs === "A" ? docsA() : docsB()) +
          foot([
            "<b>Lista</b>: só arquivos de <span class=mono>docs/adr/*.md</span> e <span class=mono>docs/prd/*.md</span> (planos, reports e handoffs ficam fora).",
            "<b>Número</b> e <b>título</b>: nome do arquivo (<span class=mono>NNNN-slug.md</span>) e primeiro título do arquivo.",
            "<b>Status</b> e <b>data</b>: falta um campo padrão no arquivo; hoje sairiam do texto do documento e da data do último commit (git).",
          ])
        );
      }

      const SCREENS = [
        ["chats", "Chats", renderChats],
        ["sprints", "Sprints", renderSprints],
        ["docs", "Documentos", renderDocs],
      ];
      let cur = SCREENS.some((s) => s[0] === location.hash.slice(1))
        ? location.hash.slice(1)
        : "chats";
      function draw() {
        document.getElementById("tabs").innerHTML = SCREENS.map(
          (s) =>
            `<button role="tab" aria-selected="${s[0] === cur}" data-s="${s[0]}">${s[1]}</button>`,
        ).join("");
        document.getElementById("app").innerHTML =
          `<p class="draftnote">Rascunho com dados de exemplo · Projetos › ${SCREENS.find((s) => s[0] === cur)[1]}</p>` +
          SCREENS.find((s) => s[0] === cur)[2]();
      }
      document.addEventListener("click", (e) => {
        const v = e.target.closest("button[data-var]");
        if (v) {
          const [scr, val] = v.dataset.var.split(":");
          variant[scr] = val;
          draw();
          return;
        }
        const f = e.target.closest("button[data-filter]");
        if (f) {
          docFilter = f.dataset.filter;
          draw();
          return;
        }
        const b = e.target.closest("button[data-s]");
        if (b) {
          cur = b.dataset.s;
          history.replaceState(null, "", "#" + cur);
          draw();
        }
      });
      draw();
    </script>
  </body>
</html>
