<title>Painel IA — três direções</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: app escuro de propósito (direção A). Barra fixa com as 3 telas + Ociosos; cada tela usa os mesmos tokens. */
:root{
  --bg:#0d1117;--fg:#dfe6ee;--muted:#7d8a99;--line:#222b36;--card:#121922;--accent:#4cc2ff;--r:2px;
  --run:#4cc2ff;--warn:#f0b429;--bad:#ff5d5d;--ok:#3ddc97;--g1:#17694a;--g2:#3ddc97;--tl:#4cc2ff;--cl:#f39a55;--rv:#a98bff;
  --f-ui:"IBM Plex Sans Condensed",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,a{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.lbl,h3{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{font:600 13px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;background:transparent;padding:6px 12px;font-size:14px;color:var(--muted);border-radius:var(--r)}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--line);background:var(--card);box-shadow:inset 0 -2px 0 var(--accent)}
.tabs .idle-tab{margin-left:8px;font-size:13px}
.nav .limits{margin-left:auto}
main{padding-block:20px 40px}
.draftnote{font-size:12px;color:var(--muted);margin:0 0 16px}

.limits{display:flex;gap:16px;flex-wrap:wrap}
.lim{display:grid;gap:3px;min-width:140px}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;border-radius:1px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-run{color:var(--run)} .p-wait{color:var(--warn)} .p-bad{color:var(--bad)} .p-ok{color:var(--ok)}
.live::before{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live::before{animation:none}}
svg.spark{display:block;width:140px;max-width:100%;height:36px;overflow:visible;justify-self:end}
h3{margin:0 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* colunas por projeto (Bem-vindo e Sala de controle) */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.col{background:var(--card);padding:16px;display:grid;gap:16px;align-content:start;min-width:0}
.col header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.col h2{margin:0;font-size:20px;font-weight:600}
.alert{border-left:3px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);padding:8px 10px;font-size:13px;display:grid;gap:4px}
.alert.w{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.alert b{font-weight:600}
.tasks{display:flex;gap:3px}
.tasks span{flex:1;height:22px;display:grid;place-items:center;font:500 10px var(--f-mono);background:var(--line);color:var(--muted)}
.tasks .done{background:color-mix(in srgb,var(--ok) 30%,var(--card));color:var(--fg)}
.tasks .running{background:var(--run);color:#06121c}
.tasks .failed{background:var(--bad);color:#1b0505}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.r{text-align:right}
.ctx{width:56px}
.money{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end}
.money strong{font:600 22px var(--f-mono)}
.acc-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acc-btns button{border:1px solid var(--line);background:transparent;padding:5px 10px;font-size:13px;border-radius:var(--r);display:inline-flex;gap:6px;align-items:center}
.acc-btns button::after{content:"▾";font-size:10px;color:var(--muted);transition:transform .15s}
.acc-btns button[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.acc-btns button[aria-expanded="true"]::after{transform:rotate(180deg);color:var(--accent)}
.acc{border:1px solid var(--line);border-top:2px solid var(--accent);padding:10px 12px;margin-top:8px;display:grid;gap:10px;font-size:13px}
.acc .goal{font-size:15px;font-weight:500;margin:0;line-height:1.4}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-size:12px}
.trow{display:grid;grid-template-columns:16px 1fr;gap:2px 8px;padding:6px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .ic{font-family:var(--f-mono)}
.trow .sub{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 10px;font:11px var(--f-mono);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.acc-btns button::after{transition:none}}
/* acordeão com % concluído (modelo do print) */
.vars{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:14px;font-size:13px}
.vars .seg{display:inline-flex;border:1px solid var(--line)}
.vars .seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font-size:13px}
.vars .seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.trk{display:grid;gap:8px;margin-top:12px}
.row{border:1px solid var(--line);background:var(--bg)}
.kids{border-top:1px solid var(--line)}
.kids .row{border:0;border-bottom:1px solid var(--line);background:transparent}
.kids .row:last-child{border-bottom:0}
.rh{width:100%;text-align:left;background:transparent;border:0;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;color:inherit;align-items:start}
button.rh:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.rt{font-weight:600;font-size:14px;min-width:0}
.rt small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
button.rh .rt::before{content:"▸ ";color:var(--muted)}
button.rh[aria-expanded="true"] .rt::before{content:"▾ ";color:var(--accent)}
.rr{font:12px var(--f-mono);color:var(--muted);text-align:right;white-space:nowrap}
.rr b{color:var(--fg);font-size:14px;margin-left:6px}
.rc{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.rb{font:11px var(--f-mono);color:var(--muted);text-align:right;align-self:center;white-space:nowrap}
.pbar{grid-column:1/-1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
/* a cor na ponta da barra mostra a completude: o gradiente cobre a largura toda e é recortado no % */
.pbar i{display:block;height:100%;width:100%;background:var(--grad)}
.grad-a{--grad:linear-gradient(90deg,#c9921c 0%,#f2dc6b 50%,#3ddc97 100%)}
.grad-b{--grad:linear-gradient(90deg,#d6f5e5 0%,#8fe8bf 50%,#22b974 100%)}
/* mini-gantt: posição = plano da sprint; cor = etapa; intensidade = % */
.gantt{display:grid;grid-template-columns:64px minmax(0,1fr);margin-top:4px}
.glabels div,.grow{height:18px}
.glabels div{font:10px var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.glabels b{color:var(--fg);font-weight:500}
.gtrack{position:relative;background-image:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--line) calc(25% - 1px) 25%)}
.grow{position:relative}
.gbar{position:absolute;top:4px;height:10px;border-radius:2px}
.gbar.todo{border:1px dashed var(--muted)}
.gtrack svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.gnow{position:absolute;top:-4px;bottom:0;width:1px;background:var(--bad)}
.gnow::after{content:"agora";position:absolute;top:-10px;left:3px;font:9px var(--f-mono);color:var(--bad)}
.av{display:inline-grid;place-items:center;min-width:22px;height:18px;padding:0 4px;margin-right:6px;border-radius:9px;font:600 9px var(--f-mono);vertical-align:1px;border:1px solid var(--line);color:var(--muted)}
.av.on{border-color:var(--run);color:#06121c;background:var(--run);box-shadow:0 0 0 0 var(--run);animation:ring 1.6s infinite}
@keyframes ring{70%{box-shadow:0 0 0 5px transparent}}
@media (prefers-reduced-motion:reduce){.av.on{animation:none}}
.ctog{display:flex;align-items:center;gap:6px;width:100%;background:transparent;border:0;padding:0;text-align:left}
.ctog::before{content:"▾";font-size:10px;color:var(--accent);margin-bottom:8px}
.ctog[aria-expanded="false"]::before{content:"▸";color:var(--muted)}
.lane-h .ctog::before{margin-bottom:0}
.pad{padding:16px 12px 10px}
.times{margin:0;border:0;font-family:var(--f-mono);table-layout:fixed}
.times caption{text-align:left;font:500 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
.times th{font:500 10px var(--f-mono);color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.times td{font-size:15px;font-weight:600;padding:8px 10px;border:0}
.times td .muted{font-size:11px;font-weight:400;display:block}
.gkey{display:flex;gap:10px;flex-wrap:wrap;font:10px var(--f-mono);color:var(--muted);margin-top:6px}
.gkey span::before{content:"";display:inline-block;width:10px;height:6px;border-radius:1px;margin-right:4px;background:var(--c)}
.gradkey{display:inline-block;width:90px;height:6px;border-radius:3px;background:var(--grad);vertical-align:middle;margin:0 6px}
.wv{--wc:var(--muted)} .wv0{--wc:#4cc2ff} .wv1{--wc:#c77dff} .wv2{--wc:#f39a55} .wv3{--wc:#ff7eb6}
.wa .row.wv{background:color-mix(in srgb,var(--wc) 8%,transparent);box-shadow:inset 3px 0 0 var(--wc)}
.wb .row.wv{background:color-mix(in srgb,var(--wc) 15%,transparent)}
.wb .row.wv+.row.wv:not(.same){border-top:2px solid var(--bg)}
.chip.w{background:color-mix(in srgb,var(--wc) 25%,transparent);color:var(--wc)}
.wlegend{display:flex;gap:12px;flex-wrap:wrap;padding:6px 12px;font:11px var(--f-mono);color:var(--muted);border-bottom:1px solid var(--line)}
.wlegend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;background:var(--wc)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stats div{background:var(--card);padding:8px 12px;display:grid;gap:2px}
.stats b{font:600 15px var(--f-mono)}
.stats small{color:var(--muted);font-size:11px}
.when{padding:8px 12px;font:12px var(--f-mono);color:var(--muted);border-bottom:1px solid var(--line)}
.lv1>.rh .pbar{height:8px}
.kids .lv2>.rh{padding-left:24px}
.kids .lv3>.rh{padding-left:38px}
.chip{font:500 10px var(--f-mono);padding:2px 6px;border-radius:3px;background:var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.run{background:color-mix(in srgb,var(--run) 16%,transparent);color:var(--run)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

/* Bem-vindo */
.hello{display:grid;gap:6px;margin-bottom:18px;max-width:75ch}
.hello h1{margin:0;font-size:28px;font-weight:600;text-wrap:balance}
.hello p{margin:0;color:var(--muted)}
.next{border:1px solid var(--accent);padding:10px 12px;display:grid;gap:8px}
.next .lbl{color:var(--accent)}
.next strong{font-size:16px;font-weight:600}
.next button{justify-self:start;background:var(--accent);color:#06121c;border:0;padding:6px 14px;font-weight:600;border-radius:var(--r)}
.since{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}
.since li{display:grid;grid-template-columns:16px 1fr;gap:6px}
.since .k{font-family:var(--f-mono)}
.where{font-size:14px;line-height:1.45;margin:0}
.docs{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px}
.docs li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.docs .t{font:500 10px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;min-width:56px;display:inline-block}
.backlog{margin:0;padding-left:18px;font-size:13px;display:grid;gap:3px}

/* Linha do tempo */
.tlbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:14px;height:6px;margin-right:6px;vertical-align:middle;background:var(--c)}
.range{display:inline-flex;border:1px solid var(--line)}
.range button{border:0;background:transparent;color:var(--muted);padding:5px 10px;font-size:12px}
.range button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.scroll{overflow-x:auto;border:1px solid var(--line);background:var(--card)}
.tl{min-width:760px;display:grid;grid-template-columns:220px 1fr}
.axis{grid-column:2;position:relative;height:26px;border-bottom:1px solid var(--line)}
.axis span{position:absolute;top:6px;font:11px var(--f-mono);color:var(--muted);transform:translateX(-50%)}
.lane-h{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:6px;align-content:start}
.lane-h h2{margin:0;font-size:16px;font-weight:600}
.lane-h .meta{font-size:12px;color:var(--muted)}
.lane{position:relative;border-bottom:1px solid var(--line);border-left:1px solid var(--line);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(100%/6 - 1px),var(--line) calc(100%/6 - 1px) calc(100%/6))}
.track{position:absolute;left:0;right:0;height:14px}
.seg-b{position:absolute;height:100%;border-radius:1px;background:var(--c)}
.seg-b.open{background:repeating-linear-gradient(45deg,var(--c) 0 6px,color-mix(in srgb,var(--c) 55%,transparent) 6px 12px)}
.seg-b.adhoc{background:transparent;border:1px dashed var(--c)}
.seg-b.adhoc.open{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c) 35%,transparent) 0 6px,transparent 6px 12px)}
.legend .adhoc-key::before{background:transparent;outline:1px dashed var(--muted);outline-offset:-1px}
.who{position:absolute;font-size:10px;color:var(--muted);transform:translateY(-12px)}
.mk{position:absolute;top:4px;transform:translateX(-50%);font-size:11px;white-space:nowrap;padding:1px 6px;background:var(--card);border:1px solid var(--c);color:var(--c);font-weight:600}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2}
.nowline::after{content:"agora";position:absolute;top:-1px;left:4px;font:600 10px var(--f-mono);color:var(--bad)}

/* Ociosos */
.idle{display:grid;gap:10px;max-width:880px}
.idle .it{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);padding:12px 14px}
.idle .it h2{margin:0;font-size:16px}
.idle .it small{color:var(--muted);display:block}
.idle .it button{border:1px solid var(--line);background:transparent;padding:6px 12px;font-size:13px}
.idle .note{font-size:13px;color:var(--muted);max-width:65ch;margin:0}
@media (max-width:560px){.idle .it{grid-template-columns:1fr}.nav .limits{margin-left:0}}
</style>

<nav class="nav wrap">

</nav>

const SCREENS = [
  { id: "inicio", name: "Bem-vindo de volta", render: renderWelcome },
  { id: "controle", name: "Sala de controle", render: renderControl },
  { id: "tempo", name: "Linha do tempo", render: renderTimeline },
  { id: "ociosos", name: `Ociosos (${idle.length})`, render: renderIdle, cls: "idle-tab" },
];
let cur = location.hash.slice(1);
if (!SCREENS.some(s => s.id === cur)) cur = "inicio";
function draw() {
  document.getElementById("tabs").innerHTML = SCREENS.map(s => `<button role="tab" class="${s.cls || ""}" aria-selected="${s.id === cur}" data-s="${s.id}">${s.name}</button>`).join("");
  document.getElementById("app").innerHTML = `<p class="draftnote">Rascunho com dados de exemplo.</p>` + SCREENS.find(s => s.id === cur).render();
}
document.getElementById("limits").innerHTML = limitsHtml();
document.addEventListener("click", e => {
  const c = e.target.closest("button[data-col]");
  if (c) { const k = c.dataset.col; closed.has(k) ? closed.delete(k) : closed.add(k); draw(); document.querySelector(`[data-col="${k}"]`).focus(); return; }
  const v = e.target.closest("button[data-var]");
  if (v) { variant = +v.dataset.var; draw(); return; }
  const a = e.target.closest("button[data-acc]");
  if (a) { const k = a.dataset.acc; open.has(k) ? open.delete(k) : open.add(k); draw(); document.querySelector(`[data-acc="${k}"]`).focus(); return; }
  const b = e.target.closest("button[data-s]"); if (!b) return;
  cur = b.dataset.s; history.replaceState(null, "", "#" + cur); draw(); scrollTo(0, 0);
});
draw();
</script>
